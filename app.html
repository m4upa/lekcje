<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0ff">
<title>Plan lekcji</title>
<style>
/* ===== motywy ===== */
:root{
 --bg:#eaf0ff;--card:#fff;--tx:#0f172a;--mu:#5b6b85;--bd:rgba(15,23,42,.1);--ov:rgba(15,23,42,.38);--ac:#2f6df6;
 --o1:#93b4ff;--o2:#d3b8ff;--o3:#9eeaf9;--oo:.75;--sheen:.6;
 --gb:rgba(255,255,255,.85);
 --gsh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 12px 30px -14px rgba(30,41,90,.4);
 --gb-d:rgba(255,255,255,.13);
 --gsh-d:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 34px -12px rgba(0,0,0,.7);
 --glass:color-mix(in srgb,var(--card) 55%,transparent);
 --glass2:color-mix(in srgb,var(--card) 82%,transparent);
 --glassc:color-mix(in srgb,var(--card) 72%,transparent);
 color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#070d1c;--card:#14203a;--tx:#e6edf8;--mu:#8fa3c2;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.6);--ac:#3b82f6;--o1:#1d4ed8;--o2:#6d28d9;--o3:#0e7490;--oo:.45;--sheen:.3;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}}
:root[data-theme=dark]{--bg:#070d1c;--card:#14203a;--tx:#e6edf8;--mu:#8fa3c2;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.6);--ac:#3b82f6;--o1:#1d4ed8;--o2:#6d28d9;--o3:#0e7490;--oo:.45;--sheen:.3;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=violet]{--bg:#0b0614;--card:#1e1233;--tx:#f0ebff;--mu:#b39cf5;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.6);--ac:#8b5cf6;--o1:#7c3aed;--o2:#c026d3;--o3:#4c1d95;--oo:.5;--sheen:.3;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=aqua]{--bg:#e6fcff;--card:#fff;--tx:#073042;--mu:#0e7490;--bd:rgba(7,48,66,.1);--ov:rgba(7,48,66,.35);--ac:#0e7490;--o1:#5ee1f5;--o2:#5eead4;--o3:#a5f3fc;--oo:.8;color-scheme:light}
:root[data-theme=red]{--bg:#0b0707;--card:#221212;--tx:#ffe9e9;--mu:#fca5a5;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.65);--ac:#dc2626;--o1:#dc2626;--o2:#7f1d1d;--o3:#f97316;--oo:.45;--sheen:.28;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=forest]{--bg:#06110c;--card:#10261b;--tx:#e0fbe9;--mu:#86efac;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.6);--ac:#16a34a;--o1:#16a34a;--o2:#065f46;--o3:#84cc16;--oo:.42;--sheen:.28;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=pink]{--bg:#ffeef7;--card:#fff;--tx:#4a0623;--mu:#be185d;--bd:rgba(74,6,35,.1);--ov:rgba(74,6,35,.33);--ac:#be185d;--o1:#f9a8d4;--o2:#fda4af;--o3:#fbcfe8;--oo:.85;color-scheme:light}
:root[data-theme=amoled]{--bg:#000;--card:#101010;--tx:#f5f5f5;--mu:#9ca3af;--bd:rgba(255,255,255,.09);--ov:rgba(0,0,0,.75);--ac:#3b82f6;--o1:#1e3a8a;--o2:#312e81;--o3:#0f172a;--oo:.28;--sheen:.2;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=snow]{--bg:#081426;--card:#13294a;--tx:#eef7ff;--mu:#9cc4ec;--bd:rgba(255,255,255,.12);--ov:rgba(2,8,20,.62);--ac:#0284c7;--o1:#38bdf8;--o2:#6366f1;--o3:#a5d8ff;--oo:.4;--sheen:.38;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}

:root[data-theme=cyberpunk]{--bg:#09050f;--card:#1a0f2e;--tx:#fff5fd;--mu:#c9a0ff;--bd:rgba(5,217,232,.18);--ov:rgba(4,0,10,.68);--ac:#e11d63;--o1:#ff2a6d;--o2:#05d9e8;--o3:#fcee09;--oo:.38;--sheen:.3;--gb:rgba(5,217,232,.42);--gsh:inset 0 1px 0 rgba(255,255,255,.2),0 0 18px -6px rgba(255,42,109,.6),0 14px 34px -12px rgba(0,0,0,.7);color-scheme:dark}
:root[data-theme=cyberpunk] h1{text-shadow:0 0 14px rgba(255,42,109,.7)}
:root[data-theme=matrix]{--bg:#000b03;--card:#04200c;--tx:#cbffd8;--mu:#3ddc6b;--bd:rgba(0,255,102,.16);--ov:rgba(0,6,2,.7);--ac:#00a844;--o1:#00ff55;--o2:#00692a;--o3:#003d17;--oo:.32;--sheen:.22;--gb:rgba(0,255,102,.3);--gsh:inset 0 1px 0 rgba(0,255,102,.25),0 0 16px -8px rgba(0,255,102,.6),0 14px 34px -12px rgba(0,0,0,.75);color-scheme:dark}
:root[data-theme=gold]{--bg:#0c0a05;--card:#201b0e;--tx:#fff4d6;--mu:#e6bc52;--bd:rgba(255,255,255,.1);--ov:rgba(0,0,0,.65);--ac:#a16207;--o1:#f59e0b;--o2:#b45309;--o3:#fde047;--oo:.34;--sheen:.3;--gb:rgba(245,179,1,.32);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=sunset]{--bg:#1a0b24;--card:#2d1339;--tx:#fff1e6;--mu:#ffb88a;--bd:rgba(255,255,255,.1);--ov:rgba(10,0,16,.65);--ac:#ea580c;--o1:#f97316;--o2:#a21caf;--o3:#fb7185;--oo:.5;--sheen:.3;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}
:root[data-theme=mint]{--bg:#e8fdf3;--card:#fff;--tx:#052e22;--mu:#047857;--bd:rgba(5,46,34,.1);--ov:rgba(5,46,34,.33);--ac:#059669;--o1:#6ee7b7;--o2:#a7f3d0;--o3:#99f6e4;--oo:.85;color-scheme:light}
:root[data-theme=lavender]{--bg:#f4efff;--card:#fff;--tx:#2e1065;--mu:#7c3aed;--bd:rgba(46,16,101,.1);--ov:rgba(46,16,101,.33);--ac:#7c3aed;--o1:#c4b5fd;--o2:#e9d5ff;--o3:#f5d0fe;--oo:.85;color-scheme:light}
:root[data-theme=ocean]{--bg:#031219;--card:#0a2a3a;--tx:#e0f7ff;--mu:#7dd3fc;--bd:rgba(255,255,255,.1);--ov:rgba(0,8,14,.65);--ac:#0891b2;--o1:#06b6d4;--o2:#1d4ed8;--o3:#14b8a6;--oo:.42;--sheen:.3;--gb:var(--gb-d);--gsh:var(--gsh-d);color-scheme:dark}

/* ===== baza ===== */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--tx);min-height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);transition:background .5s,color .4s}
button,select,input{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);transition:background .5s}
#bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:var(--oo);will-change:transform;transform:translateZ(0)}
#bg i:nth-child(1){background:radial-gradient(circle,var(--o1) 0%,transparent 62%);left:-24vmax;top:-22vmax;animation:d1 24s ease-in-out infinite alternate}
#bg i:nth-child(2){background:radial-gradient(circle,var(--o2) 0%,transparent 62%);right:-28vmax;top:18vh;animation:d2 30s ease-in-out infinite alternate}
#bg i:nth-child(3){background:radial-gradient(circle,var(--o3) 0%,transparent 62%);left:-8vmax;bottom:-30vmax;animation:d3 27s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(26vmax,18vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-30vmax,22vmax) scale(.85)}}
@keyframes d3{to{transform:translate(34vmax,-16vmax) scale(1.2)}}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s}

/* szkło — efekty ograniczone na urządzeniach mobilnych */
.hg,#drawer{backdrop-filter:blur(10px) saturate(125%);-webkit-backdrop-filter:blur(10px) saturate(125%)}
@media(max-width:600px){
  .hg,#drawer{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  #bg i{animation-duration:40s!important}
  .l,.box,.free{animation-duration:.28s}
}
@media(hover:none){
  .l.now{animation:rise .28s ease-out both}
}

/* ===== nagłówek ===== */
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;max-width:660px;margin:0 auto}
.hg{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--gsh);border-radius:28px;padding:10px;position:relative;overflow:hidden}
.hg::after,.l::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 36%);opacity:var(--sheen);pointer-events:none}
.top{display:flex;align-items:center;gap:10px}
.tt{flex:1;min-width:0}
h1{font-size:19px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mu);margin-top:1px}
.ico{flex:none;width:42px;height:42px;border-radius:50%;font-size:18px;background:color-mix(in srgb,var(--tx) 8%,transparent);border:1px solid var(--gb);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s;position:relative;z-index:1}
.ico:active{transform:scale(.86)}
#ref.spin{animation:spin .8s linear infinite}
.wk{display:flex;align-items:center;gap:8px;margin-top:10px;position:relative;z-index:1}
.wk span{flex:1;text-align:center;font-size:14px;font-weight:650}
.wk button{background:color-mix(in srgb,var(--tx) 8%,transparent);border-radius:12px;min-width:42px;min-height:34px;font-size:18px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.wk button:active{transform:scale(.88)}
.days{position:relative;display:flex;margin-top:10px;padding:4px;border-radius:20px;background:color-mix(in srgb,var(--tx) 7%,transparent);box-shadow:inset 0 2px 7px rgba(0,0,0,.14)}
#dbtn{display:flex;flex:1;gap:2px;position:relative;z-index:1}
.day{flex:1;min-height:48px;border-radius:16px;background:transparent;font-size:13px;font-weight:650;line-height:1.2;transition:color .25s}
.day small{display:block;font-size:11px;opacity:.7;font-weight:500}
.day.act{color:#fff}
.day.act small{opacity:.92}
.day.today small::after{content:" •"}
#bub{position:absolute;left:0;top:4px;width:0;height:0;border-radius:16px;z-index:0;pointer-events:none;opacity:0;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 78%,#fff),var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.15),0 8px 18px -6px var(--ac);transition:transform .5s cubic-bezier(.34,1.5,.5,1),width .35s,height .35s,opacity .25s}
.subsview .wk,.subsview .days{display:none}

/* ===== treść ===== */
main{position:relative;z-index:1;padding:14px 12px calc(28px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto}
.st{font-size:13px;color:var(--mu);text-align:center;padding:22px 8px}
.st:not(.idle)::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--ac);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:rgba(254,226,226,.94);color:#991b1b;border-radius:18px;padding:12px 14px;font-size:13px;margin-bottom:10px;white-space:pre-wrap}
.box{background:linear-gradient(145deg,rgba(253,224,71,.95),rgba(245,158,11,.92));color:#431407;border-radius:20px;padding:12px 14px;font-size:13px;line-height:1.4;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 26px -14px rgba(180,83,9,.7)}
.box b{display:block;margin-bottom:4px;font-size:14px}
.box div{padding:3px 0}
.box.none{background:var(--glassc);color:var(--tx);border:1px solid var(--gb);box-shadow:var(--gsh)}
.box.none b{color:var(--tx)}
.new{background:linear-gradient(145deg,#3b82f6,#2563eb);color:#fff;border-radius:18px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 12px 24px -12px #2563eb}
.new button{background:rgba(255,255,255,.95);color:#1d4ed8;font-weight:650;border-radius:12px;padding:8px 12px;white-space:nowrap}
.l{position:relative;display:flex;gap:12px;align-items:center;margin-bottom:9px;padding:12px 12px 12px 18px;border-radius:22px;background:radial-gradient(130% 160% at 0% 50%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),var(--glassc);border:1px solid var(--gb);box-shadow:var(--gsh);overflow:hidden}
.l>*{position:relative;z-index:1}
.l::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c);box-shadow:0 0 12px var(--c);z-index:1}
.n{min-width:52px;padding:6px 4px;border-radius:15px;text-align:center;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.n b{font-size:21px;font-weight:800;display:block;line-height:1.15}
.n small{display:block;font-size:10.5px;color:var(--mu);line-height:1.25;font-variant-numeric:tabular-nums}
.i{flex:1;min-width:0;overflow-wrap:anywhere}
.s{font-weight:650;font-size:16px;letter-spacing:-.01em}
.d{font-size:13px;color:var(--mu);margin-top:2px}
.l.x{filter:grayscale(1);opacity:.55;--c:#94a3b8}
.l.x .s,.l.x .d{text-decoration:line-through}
.l.z{box-shadow:var(--gsh),0 0 0 2px #f59e0b}
.l.jn{margin-bottom:0;border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.l.jp{border-top-left-radius:8px;border-top-right-radius:8px;border-top-color:var(--bd)}
.l:not(.jn){margin-bottom:9px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:6px;margin-right:4px}
.tag.x{background:#64748b;color:#fff}
.tag.z{background:#f59e0b;color:#1c1917}
.tag.nw{background:var(--c);color:#fff}
.tag.nw::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:1px;animation:blink 1.2s ease-in-out infinite}
.l:not(.now) .tag.nw{display:none}
@keyframes blink{50%{opacity:.25}}
.l.now{animation:rise .5s cubic-bezier(.2,.8,.2,1) both,pulse 2.4s ease-out .6s infinite}
@keyframes pulse{0%{box-shadow:var(--gsh),0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:var(--gsh),0 0 0 10px transparent}}
.free{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:2px 4px 11px}
.free::before,.free::after{content:"";flex:1;border-top:1px dashed color-mix(in srgb,var(--mu) 50%,transparent)}
.l,.box,.free{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}

/* ===== menu boczne ===== */
#scrim{position:fixed;inset:0;background:var(--ov);opacity:0;pointer-events:none;transition:opacity .3s;z-index:29}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:8px;bottom:8px;left:8px;width:min(300px,84vw);z-index:30;background:var(--glass2);border:1px solid var(--gb);box-shadow:var(--gsh),0 30px 60px -20px rgba(0,0,0,.5);border-radius:30px;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-112%) scale(.96);transition:transform .45s cubic-bezier(.3,1.25,.5,1),visibility 0s .45s;visibility:hidden;overflow:auto}
#drawer.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.dh{display:flex;align-items:center;gap:12px;padding:6px 8px 16px}
.dh b{display:block;font-size:18px;letter-spacing:-.01em}
.dh small{color:var(--mu);font-size:13px}
.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac));display:grid;place-items:center;font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px var(--ac)}
.di{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 14px;border-radius:18px;background:transparent;font-size:16px;margin-bottom:4px;transition:background .2s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.di i{font-style:normal;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--tx) 8%,transparent)}
.di:active{transform:scale(.96)}
.di.on{background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));color:#fff;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -8px var(--ac)}
.di.on i{background:rgba(255,255,255,.22)}
.dsep{height:1px;background:var(--bd);margin:10px 8px}
.dv{margin-top:auto;padding:10px 14px;color:var(--mu);font-size:12px}
.d-in #drawer .di{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}

/* ===== ustawienia ===== */
#sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
#sheet.on{opacity:1;pointer-events:auto}
.pan{background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--gb);box-shadow:var(--gsh);width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;contain:layout paint}
.pan h2{font-size:19px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pan h2 button{background:color-mix(in srgb,var(--tx) 10%,transparent);border-radius:50%;width:34px;height:34px}
.pan label{display:block;font-size:12px;color:var(--mu);margin:16px 0 8px;font-weight:600}
.pan select,.pan input[type=url]{width:100%;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--tx) 7%,transparent);border:1px solid var(--bd);font-size:16px}
.pan select option{color:#0f172a;background:#fff}
.thb{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--tx) 7%,transparent);border:1px solid var(--bd);font-size:15px;font-weight:600;text-align:left}
.thb .sw2{flex:none;width:44px;height:30px;border-radius:10px;background:linear-gradient(110deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--bd)}
.thb #thname{flex:1;min-width:0}
.thb i{font-style:normal;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.thb[aria-expanded=true] i{transform:rotate(180deg)}
.thl{display:none;margin-top:10px}
.thl.on{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tiles button{position:relative;height:66px;border-radius:18px;background:linear-gradient(110deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;overflow:hidden}
.tiles button:active{transform:scale(.94)}
.tiles button span{position:absolute;left:6px;right:6px;bottom:6px;padding:4px 6px;border-radius:11px;background:rgba(10,14,25,.62);color:#fff;font-size:12px;font-weight:600;line-height:1.2;}
.tiles button.on{transform:scale(1.03);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ac)}
.tiles button.on::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}

<script>
const APP_VERSION='1.4.0',APP_DATE='27.10.2026';
const BASE='https://tme.edupage.org';
const DN=['Pon','Wt','Śr','Czw','Pt'];
let LOG=[];
const DEFAULT_PROXY='https://cwel.apollodwa.workers.dev/';
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s.\-]/g,'');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let S=Object.assign({theme:'auto',cls:'4G',group:'2',tt:'auto',proxy:'',fx:true},LS.get('plan_settings',{}));
if(!('fx' in LS.get('plan_settings',{}))&&(navigator.hardwareConcurrency||8)<=4)S.fx=false;
let RAW=null,TTS=[],curTT=null,newPlan=null,weekStart=mondayOf(new Date()),sel=0,subHtml={},gshSub=null,loadErr='';

function saveS(){LS.set('plan_settings',S)}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const THEMES=[
 {k:'auto',n:'Auto · jasny / ciemny',a:'#ffffff',b:'#0f172a'},
 {k:'light',n:'Biało-niebieski',a:'#ffffff',b:'#3b82f6'},
 {k:'dark',n:'Granatowo-niebieski',a:'#0b1120',b:'#3b82f6'},
 {k:'violet',n:'Czarno-fioletowy',a:'#0b0614',b:'#8b5cf6'},
 {k:'aqua',n:'Biało-aqua',a:'#ffffff',b:'#06b6d4'},
 {k:'red',n:'Czarno-czerwony',a:'#0b0707',b:'#dc2626'},
 {k:'forest',n:'Czarno-zielony',a:'#06110c',b:'#16a34a'},
 {k:'pink',n:'Różowo-biały',a:'#ec4899',b:'#ffffff'},
 {k:'amoled',n:'Czarno-szary AMOLED',a:'#000000',b:'#374151'},
 {k:'snow',n:'Granatowo-biały ❄ śnieg',a:'#0a1d38',b:'#ffffff'},
 {k:'cyberpunk',n:'Cyberpunk · różowo-turkusowy',a:'#ff2a6d',b:'#05d9e8'},
 {k:'matrix',n:'Matrix · czarno-neonowa zieleń',a:'#000000',b:'#00ff66'},
 {k:'gold',n:'Czarno-złoty',a:'#0c0a05',b:'#f5b301'},
 {k:'sunset',n:'Pomarańczowo-fioletowy',a:'#f97316',b:'#7c3aed'},
 {k:'ocean',n:'Granatowo-turkusowy',a:'#031219',b:'#06b6d4'},
 {k:'mint',n:'Biało-miętowy',a:'#ffffff',b:'#34d399'},
 {k:'lavender',n:'Biało-lawendowy',a:'#ffffff',b:'#a78bfa'}
];
const SN={f:[],run:false,raf:0,w:0,h:0,x:null};
function snFlake(init){const z=Math.random();return{x:Math.random()*SN.w,y:init?Math.random()*SN.h:-10,r:1.2+z*z*4.2,v:.4+z*1.4,p:Math.random()*6.28,a:.6+z*.4,w:.5+Math.random()}}
function snSize(){const c=$('snow'),d=Math.min(window.devicePixelRatio||1,1.5);SN.w=innerWidth;SN.h=innerHeight;c.width=SN.w*d;c.height=SN.h*d;SN.x=c.getContext('2d');SN.x.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(100,SN.w*SN.h/12000));while(SN.f.length<n)SN.f.push(snFlake(true));SN.f.length=n}
function snTick(t){if(!SN.run)return;const x=SN.x;x.clearRect(0,0,SN.w,SN.h);x.fillStyle='#fff';
  for(const f of SN.f){f.y+=f.v;f.x+=Math.sin(t/1200*f.w+f.p)*.4*f.w+.15;if(f.y>SN.h+8)Object.assign(f,snFlake(false));if(f.x>SN.w+8)f.x=-8;x.globalAlpha=f.a;x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill()}
  SN.raf=requestAnimationFrame(snTick)}
function snowSet(on){const c=$('snow');if(on&&!SN.run){snSize();SN.run=true;c.style.opacity=1;SN.raf=requestAnimationFrame(snTick)}else if(!on&&SN.run){SN.run=false;cancelAnimationFrame(SN.raf);c.style.opacity=0}else if(!on)c.style.opacity=0}
addEventListener('resize',()=>{if(SN.run)snSize();moveBub()});
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  const on=S.fx&&!RM;
  document.body.classList.toggle('nofx',!on);
  snowSet(on&&S.theme==='snow'&&!document.body.classList.contains('sheetopen'));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||'#eaf0ff'}
function moveBub(){const a=document.querySelector('.day.act'),b=$('bub');if(!b)return;if(!a||!a.offsetWidth){b.style.opacity=0;return}
  b.style.opacity=1;b.style.width=a.offsetWidth+'px';b.style.height=a.offsetHeight+'px';b.style.transform='translateX('+a.offsetLeft+'px)'}
const toMin=t=>{const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:-1};
function markNow(){const n=new Date(),m=n.getHours()*60+n.getMinutes();document.querySelectorAll('.l[data-s]').forEach(e=>{const a=+e.dataset.s,b=+e.dataset.e;e.classList.toggle('now',a>=0&&b>a&&m>=a&&m<b&&!e.classList.contains('x'))})}
setInterval(markNow,30000);
function mondayOf(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')}

/* ---------- sieć ---------- */
function step(t){$('sub').textContent=t;if(!RAW)$('main').innerHTML='<div class="st">'+esc(t)+'</div>'}
function proxies(){
  const a=[];
  const raw=(S.proxy||DEFAULT_PROXY).trim();
  const px=raw.endsWith('/')||raw.endsWith('?')||raw.endsWith('&')?raw:raw+'/';
  a.push(['proxy',u=>px+(px.includes('?')?'&':'?')+'url='+encodeURIComponent(u)]);
  a.push(['bezpośrednio',u=>u],['corsproxy.io',u=>'https://corsproxy.io/?url='+encodeURIComponent(u)]);
  return a;
}
async function req(url,opt){
  let err;const short=url.replace(BASE,'');
  // Krótsze limity zapobiegają długiemu „wiszeniu” aplikacji, gdy proxy nie odpowiada.
  const chain=proxies();
  for(let i=0;i<chain.length;i++){
    const [n,p]=chain[i],c=new AbortController();
    const timeout=i===0?6000:4500;
    const t=setTimeout(()=>c.abort(),timeout);
    try{
      const r=await fetch(p(url),{...opt,signal:c.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.text();
    }catch(e){
      err=e.name==='AbortError'?new Error('przekroczono czas oczekiwania ('+(timeout/1000)+' s)'):e;
      LOG.push(short.slice(0,40)+' ['+n+'] → '+err.message);
    }finally{clearTimeout(t)}
  }
  throw err||new Error('Brak odpowiedzi z serwera');
}
async function getGsh(path){
  try{const h=await req(BASE+path);const m=h.match(/gsh["']?\s*[:=]\s*["']([0-9a-f]+)["']/i);return{gsh:m?m[1]:'00000000',html:h}}
  catch(e){return{gsh:'00000000',html:''}}
}
async function post(path,func,args,gsh){
  const t=await req(BASE+path+'?__func='+func,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({__args:args,__gpid:'',__gsh:gsh})});
  try{return JSON.parse(t)}catch(e){LOG.push('odpowiedź nie jest JSON: '+t.slice(0,80));throw new Error('Nieprawidłowa odpowiedź serwera')}
}

/* ---------- dane ---------- */
function prep(R){
  const idx=a=>Object.fromEntries((a||[]).map(x=>[x.id,x]));
  R.i={subj:idx(R.subjects),teach:idx(R.teachers),room:idx(R.classrooms),per:idx(R.periods),groups:idx(R.groups)};
  return R;
}
async function fetchPlan(num,gsh){
  const d=await post('/timetable/server/regulartt.js','regularttGetData',[null,String(num)],gsh);
  const tables=d.r.dbiAccessorRes.tables;
  const rows=id=>(tables.find(t=>t.id===id)||{data_rows:[]}).data_rows;
  return {num:String(num),classes:rows('classes'),subjects:rows('subjects'),teachers:rows('teachers'),classrooms:rows('classrooms'),periods:rows('periods'),groups:rows('groups'),lessons:rows('lessons'),cards:rows('cards')};
}
async function loadAll(){
  $('sub').textContent='aktualizuję…';loadErr='';LOG=[];$('ref').classList.add('spin');
  try{
    step('Łączę z Edupage…');
    const {gsh,html}=await getGsh('/timetable/');
    if(!html)throw new Error('Nie można połączyć się z Edupage (sprawdź proxy w ⚙)');
    step('Szukam planów…');
    const now=new Date(),year=now.getMonth()>=7?now.getFullYear():now.getFullYear()-1;
    try{
      const v=await post('/timetable/server/ttviewer.js','getTTViewerData',[null,year],gsh);
      TTS=(v.r.regular.timetables||[]).map(t=>({num:String(t.tt_num),name:t.text||t.name||('Plan '+t.tt_num),from:t.datefrom||''}));
    }catch(e){TTS=[]}
    if(!TTS.length){const m=html.match(/tt_num["']?\s*[:=]\s*["']?(\d+)/);if(m)TTS=[{num:m[1],name:'Plan',from:''}]}
    if(!TTS.length)throw new Error('Nie znaleziono żadnego planu lekcji.');
    const today=iso(now);
    const sorted=[...TTS].sort((a,b)=>a.from.localeCompare(b.from));
    const cur=sorted.filter(t=>!t.from||t.from<=today).pop()||sorted[sorted.length-1];
    const newest=sorted[sorted.length-1];
    // wykrywanie nowych planów
    const known=LS.get('plan_known',null);
    const fresh=known?TTS.filter(t=>!known.includes(t.num)):[];
    LS.set('plan_known',TTS.map(t=>t.num));
    let use=cur;
    if(S.tt!=='auto'){const f=TTS.find(t=>t.num===S.tt);if(f)use=f;else{S.tt='auto';saveS()}}
    newPlan=null;
    if(fresh.length&&S.tt!=='auto')newPlan=fresh[fresh.length-1];
    else if(S.tt!=='auto'&&newest.num!==use.num&&fresh.length)newPlan=newest;
    if(fresh.length&&S.tt==='auto')loadErr='info:Pojawił się nowy plan: '+fresh[fresh.length-1].name;
    curTT=use;
    step('Pobieram plan…');
    RAW=prep(await fetchPlan(use.num,gsh));
    LS.set('plan_raw',RAW);LS.set('plan_raw_stamp',Date.now());
    subHtml={};
    $('sub').textContent=new Date().toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    loadErr=(RAW?'offline – dane z pamięci. ':'')+'Błąd: '+e.message+(LOG.length?'\n\nSzczegóły:\n'+LOG.join('\n'):'');
    $('sub').textContent=RAW?'offline – dane z pamięci':'błąd';
  }
  $('ref').classList.remove('spin');fillSettings();render();
}

function getClass(){
  if(!RAW)return null;
  const cs=RAW.classes;
  return cs.find(c=>norm(c.short)===norm(S.cls)||norm(c.name)===norm(S.cls))||cs.find(c=>norm(c.short).includes(norm(S.cls)))||null;
}
function groupNums(cls){
  const set=new Set();
  RAW.lessons.filter(l=>(l.classids||[]).includes(cls.id)).forEach(l=>(l.groupids||[]).forEach(g=>{
    const gr=RAW.i.groups[g];if(!gr||isWhole(gr)||(gr.classid&&gr.classid!==cls.id))return;
    const m=String(gr.name).match(/(\d+)\s*\/\s*\d+/)||String(gr.name).match(/(\d+)/);if(m)set.add(m[1]);
  }));
  return [...set].sort();
}
function isWhole(g){return g.entireclass===true||g.entireclass==='1'||/ca[łl]a|cala|klas/i.test(g.name||'')}
function isMyGroup(name){
  name=String(name||'');
  const m=name.match(/(\d+)\s*\/\s*(\d+)/);
  if(m)return m[1]===S.group;
  return new RegExp('(?:^|\\D)'+S.group+'(?:\\D|$)').test(name);
}
function groupsIn(t){
  const set=new Set();let m;
  const r1=/(\d+)\s*\/\s*\d+/g;while((m=r1.exec(t)))set.add(m[1]);
  const r2=/gr(?:up\w*)?\.?\s*(\d+(?:\s*(?:,|i|oraz|&)\s*\d+)*)/gi;
  while((m=r2.exec(t)))(m[1].match(/\d+/g)||[]).forEach(x=>set.add(x));
  const r3=/(\d+)\s*\.?\s*grup/gi;while((m=r3.exec(t)))set.add(m[1]);
  return set;
}
function mentionsOtherGroup(t){if(!S.group)return false;const g=groupsIn(t);return g.size>0&&!g.has(S.group)}
function buildDays(cls){
  const I=RAW.i;
  const lessons=Object.fromEntries(RAW.lessons.filter(l=>(l.classids||[]).includes(cls.id)).map(l=>[l.id,l]));
  const days=[[],[],[],[],[]];
  for(const c of RAW.cards){
    const l=lessons[c.lessonid];if(!l)continue;
    const di=String(c.days||'').indexOf('1');if(di<0||di>4)continue;
    const p=I.per[c.period]||{},dur=+l.durationperiods||1,s=I.subj[l.subjectid]||{};
    const gs=(l.groupids||[]).map(g=>I.groups[g]).filter(g=>g&&(!g.classid||g.classid===cls.id));
    const vis=!S.group||!gs.length||gs.some(isWhole)||gs.some(g=>isMyGroup(g.name));
    days[di].push({
      parts:Array.from({length:dur},(_,k)=>{const q=I.per[String(+c.period+k)]||{};return{period:+c.period+k,start:q.starttime||'',end:q.endtime||''}}),
      period:+c.period,dur,vis,whole:!gs.length||gs.some(isWhole),
      name:s.name||s.short||'?',short:s.short||'',
      teacher:(l.teacherids||[]).map(t=>(I.teach[t]||{}).short).filter(Boolean).join(', '),
      room:(c.classroomids||[]).map(r=>(I.room[r]||{}).short).filter(Boolean).join(', ')
    });
  }
  days.forEach(a=>a.sort((x,y)=>x.period-y.period));
  return days;
}

const subsPending=new Map();
async function loadSubs(date,cls){
  if(subHtml[date]===undefined){
    if(!subsPending.has(date)){
      const pending=(async()=>{
        if(!gshSub)gshSub=(await getGsh('/substitution/')).gsh;
        const d=await post('/substitution/server/viewer.js','getSubstViewerDayDataHtml',[null,{date,mode:'classes'}],gshSub);
        subHtml[date]=d.r||'';
      })();
      subsPending.set(date,pending);
      try{await pending}finally{subsPending.delete(date)}
    }else await subsPending.get(date);
  }
  const doc=new DOMParser().parseFromString(subHtml[date],'text/html');
  const names=[norm(cls.short),norm(cls.name)].filter(Boolean);
  const out=[];
  out.total=doc.querySelectorAll('.row').length;
  doc.querySelectorAll('.section').forEach(sec=>{
    const h=norm((sec.querySelector('.header')||{}).textContent);
    if(!names.some(n=>h===n||h.startsWith(n+',')))return;
    sec.querySelectorAll('.row').forEach(r=>{
      const pt=((r.querySelector('.period')||{}).textContent||'').trim();
      const nums=(pt.match(/\d+/g)||[]).map(Number);
      let periods=nums;
      if(nums.length==2&&/[-–]/.test(pt)){periods=[];for(let i=nums[0];i<=nums[1];i++)periods.push(i)}
      const txt=((r.querySelector('.info')||r).textContent||'').replace(/\s+/g,' ').trim();
      const cancelled=r.classList.contains('remove')||/odwo[łl]an|zwolnien|odpada|nie ma|cancel/i.test(txt);
      const tm=txt.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/);
      out.push({periods,text:txt,cancelled,label:pt,start:tm?(+tm[1])+':'+tm[2]:'',end:tm?tm[3]:''});
    });
  });
  return out;
}

const FIXED={mat:210,j:340,pol:340,ang:150,niem:30,fiz:270,chem:50,bio:120,his:20,wf:180,inf:195,wos:10,geo:90};
function hue(l){
  const k=(l.short||l.name).toLowerCase();
  for(const f in FIXED)if(k.startsWith(f))return FIXED[f];
  let h=0;for(const ch of l.name)h=(h*31+ch.charCodeAt(0))%360;return h;
}

/* ---------- zastosowanie zastępstw ---------- */
function applySubs(subs,lessons){
  const vis=[];
  const items=[],extras=[];
  for(const s of subs){
    if(mentionsOtherGroup(s.text))continue;
    if(!s.cancelled&&/przeniesion\w*\s+z\b/i.test(s.text)){
      const body=s.text.replace(/^\s*\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}\s*,?\s*/,'').replace(/^\s*\d+\s*\.?\s*grup\w*\s*:\s*/i,'');
      const nm=(body.split(/\s+-\s+/)[0]||'').trim();
      const tch=((s.text.match(/Nauczyciel:\s*([^,]+)/i)||[])[1]||'').trim();
      const fr=(s.text.match(/przeniesion\w*\s+z\s+(\d+)/i)||[])[1];
      const p=s.periods[0]||0;
      extras.push({parts:[{period:p,start:s.start||'',end:s.end||''}],period:p,dur:1,vis:true,whole:true,name:nm||'Lekcja',short:'',teacher:tch,room:'',moved:true,change:'Lekcja przeniesiona'+(fr?' z '+fr+'. godziny':'')});
      vis.push(s);continue;
    }
    const c=lessons.filter(l=>s.periods.length?s.periods.some(p=>p>=l.period&&p<l.period+l.dur):(s.start&&l.parts.some(pt=>String(pt.start).replace(/^0/,'')===s.start)));
    if(!c.length){vis.push(s);continue}
    const low=s.text.toLowerCase();
    const sm=c.filter(l=>{const n=(l.name||'').toLowerCase(),sh=(l.short||'').toLowerCase();return (n&&low.includes(n))||(sh.length>1&&new RegExp('(^|[^a-ząćęłńóśźż])'+sh.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-ząćęłńóśźż])','i').test(s.text))});
    const target=sm.length?sm:c;
    if(!target.some(l=>l.vis))continue;
    items.push({s,target});
  }
  for(const {s,target} of items){
    const vt=target.filter(l=>l.vis),ht=target.filter(l=>!l.vis);
    const key=target.map(l=>l.period+l.name+l.teacher).join('|');
    const sameRows=items.filter(x=>x.s.cancelled===s.cancelled&&x.target.map(l=>l.period+l.name+l.teacher).join('|')===key).length;
    const mine=S.group&&groupsIn(s.text).has(S.group);
    const covers=!ht.length||mine||sameRows>=target.length||!S.group;
    const ok=vt.filter(l=>l.whole||covers);
    if(!ok.length){vis.push({...s,amb:true});continue}
    vis.push(s);
    ok.forEach(l=>{if(s.cancelled){l.cancelled=true;if(/przeniesion\w*\s+na/i.test(s.text))l.movedOut=true}else l.change=(l.change?l.change+' | ':'')+s.text});
  }
  lessons.push(...extras);
  return vis;
}
function emptyMsg(total){return total>0?'Brak zastępstw ✅':'Zastępstwa nie są jeszcze dostępne ⏳'}
function itemHtml(s){return `<div>${s.label?esc(s.label)+'. ':''}${s.amb?'❔ ':s.cancelled?'❌ ':'🔁 '}${esc(s.text)}${s.amb?' <i>(może dotyczyć drugiej grupy)</i>':''}</div>`}

/* ---------- render ---------- */
let renderId=0,VIEW=LS.get('plan_view','plan');
function head(){
  let h='';
  if(loadErr){h+=loadErr.startsWith('info:')?`<div class="new"><span>${esc(loadErr.slice(5))}</span></div>`:`<div class="err">${esc(loadErr)}</div>`}
  if(newPlan)h+=`<div class="new"><span>Dostępny nowy plan: <b>${esc(newPlan.name)}</b></span><button id="goNew">Przełącz</button></div>`;
  return h;
}
const DNL=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek'];
async function renderSubs(rid){
  const main=$('main'),cls=getClass();
  let h=head();
  if(!RAW){main.innerHTML=h||'<div class="st">Ładowanie…</div>';bindNew();return}
  if(!cls){main.innerHTML=h+`<div class="err">Nie znaleziono klasy „${esc(S.cls)}”. Wybierz klasę w ustawieniach ⚙.</div>`;bindNew();return}
  $('ttl').textContent='Zastępstwa '+(cls.short||cls.name)+(S.group?' · gr. '+S.group:'');
  main.innerHTML=h+'<div class="st">Pobieram zastępstwa…</div>';bindNew();
  const days=[];let d=new Date();d.setHours(12,0,0,0);
  while(days.length<5){if((d.getDay()+6)%7<5)days.push(new Date(d));d=addDays(d,1)}
  try{if(!gshSub)gshSub=(await getGsh('/substitution/')).gsh}catch(e){}
  const all=buildDays(cls);
  const res=await Promise.all(days.map(async d=>{
    try{const subs=await loadSubs(iso(d),cls);const w=(d.getDay()+6)%7;return{d,w,total:subs.total||0,vis:applySubs(subs,all[w].map(l=>({...l})))}}
    catch(e){return{d,w:(d.getDay()+6)%7,err:e.message}}
  }));
  if(rid!==renderId)return;
  const today=iso(new Date());
  h+=res.map(r=>{
    const t=`<b>${DNL[r.w]} ${fmt(r.d)}${iso(r.d)===today?' · dziś':''}</b>`;
    if(r.err)return `<div class="box none">${t}<div>⚠ Nie udało się pobrać (${esc(r.err)})</div></div>`;
    if(!r.vis.length)return `<div class="box none">${t}<div>${emptyMsg(r.total)}</div></div>`;
    return `<div class="box">${t}${r.vis.map(itemHtml).join('')}</div>`;
  }).join('');
  main.innerHTML=h;bindNew();
}
function setView(v){VIEW=v;LS.set('plan_view',v);render()}
async function render(){
  const rid=++renderId,main=$('main');
  document.querySelector('header').classList.toggle('subsview',VIEW==='subs');
  document.querySelectorAll('.di[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  if(VIEW==='subs')return renderSubs(rid);
  const date=addDays(weekStart,sel),ds=iso(date),todayIso=iso(new Date());
  $('wl').textContent=fmt(weekStart)+' – '+fmt(addDays(weekStart,4));
  $('dbtn').innerHTML=DN.map((n,i)=>{const d=addDays(weekStart,i);return `<button class="day ${i==sel?'act':''} ${iso(d)==todayIso?'today':''}" data-i="${i}">${n}<small>${fmt(d)}</small></button>`}).join('');
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render()});
  moveBub();
  let h=head();
  const cls=getClass();
  if(!RAW){main.innerHTML=h||'<div class="st">Ładowanie…</div>';bindNew();return}
  if(!cls){main.innerHTML=h+`<div class="err">Nie znaleziono klasy „${esc(S.cls)}”. Wybierz klasę w ustawieniach ⚙.</div>`;bindNew();return}
  $('ttl').textContent='Plan '+(cls.short||cls.name)+(S.group?' · gr. '+S.group:'');
  main.innerHTML=h+'<div class="st">Sprawdzam zastępstwa…</div>';bindNew();
  let subs=[],subErr='';
  try{subs=await loadSubs(ds,cls)}catch(e){subErr='Nie udało się pobrać zastępstw ('+e.message+'). Pokazuję sam plan.'}
  if(rid!==renderId)return;
  const lessons=buildDays(cls)[sel].map(l=>({...l}));
  const vis=applySubs(subs,lessons);
  if(subErr)h+=`<div class="err">${esc(subErr)}</div>`;
  else if(!vis.length)h+=`<div class="box none"><div>${emptyMsg(subs.total||0)}</div></div>`;
  if(vis.length)h+=`<div class="box"><b>Zmiany w planie – ${DN[sel]} ${fmt(date)}</b>${vis.map(itemHtml).join('')}</div>`;
  const tiles=[];
  for(const l of lessons.filter(l=>l.vis))for(const [k,pt] of l.parts.entries())tiles.push({...l,period:pt.period,start:pt.start,end:pt.end,first:k===0});
  tiles.sort((a,b)=>a.period-b.period);
  if(!tiles.length)h+='<div class="st idle">Brak lekcji tego dnia 🎉</div>';
  const same=(a,b)=>a&&b&&a.period+1===b.period&&a.name===b.name&&a.teacher===b.teacher&&a.room===b.room&&!!a.cancelled===!!b.cancelled;
  let prev=null;
  for(const [i,l] of tiles.entries()){
    if(prev!==null&&l.period>prev+1)h+=`<div class="free">okienko (${l.period-prev-1})</div>`;
    prev=l.period;
    const cl=(l.cancelled?'x':(l.change?'z':''))+(same(tiles[i-1],l)?' jp':'')+(same(l,tiles[i+1])?' jn':'');
    h+=`<div class="l ${cl}" style="--c:hsl(${hue(l)},70%,50%);--i:${Math.min(i,9)}"${ds===todayIso?` data-s="${toMin(l.start)}" data-e="${toMin(l.end)}"`:''}>
      <div class="n"><b>${l.period}</b><small>${esc(l.start)}<br>${esc(l.end)}</small></div>
      <div class="i"><div class="s">${esc(l.name)}</div>
      <div class="d">${esc([l.teacher,l.room&&'sala '+l.room].filter(Boolean).join(' · '))}</div>
      <span class="tag nw">TERAZ</span>
      ${l.cancelled?`<span class="tag x">${l.movedOut?'PRZENIESIONA':'ODWOŁANE'}</span>`:''}
      ${l.change?`<span class="tag z">${l.moved?'PRZENIESIONA':'ZASTĘPSTWO'}</span>${l.first?`<div class="d" style="color:inherit;margin-top:4px">${esc(l.change)}</div>`:''}`:''}
    </div></div>`;
  }
  main.innerHTML=h;bindNew();markNow();
}
function bindNew(){const b=$('goNew');if(b)b.onclick=()=>{S.tt=newPlan.num;saveS();newPlan=null;loadAll()}}

/* ---------- ustawienia ---------- */
function fillSettings(){
  document.querySelectorAll('#thm button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
  $('fx').setAttribute('aria-checked',S.fx?'true':'false');
  $('litet').textContent='Tryb lekki: '+(S.fx?'wyłączony':'włączony');
  const ct=THEMES.find(t=>t.k===S.theme)||THEMES[0];$('thname').textContent=ct.n;$('thcur').style.setProperty('--a',ct.a);$('thcur').style.setProperty('--b',ct.b);
  const sc=$('selC');
  if(RAW){
    const cs=[...RAW.classes].sort((a,b)=>String(a.short||a.name).localeCompare(String(b.short||b.name),'pl',{numeric:true}));
    const cur=getClass();
    sc.innerHTML=cs.map(c=>`<option value="${esc(c.short||c.name)}" ${cur&&cur.id===c.id?'selected':''}>${esc(c.short||c.name)}</option>`).join('');
    const nums=cur?groupNums(cur):[];
    if(S.group&&!nums.includes(S.group))nums.push(S.group);
    nums.sort();
    $('selG').innerHTML=`<option value="">Wszystkie grupy</option>`+nums.map(n=>`<option value="${n}" ${S.group===n?'selected':''}>Grupa ${n}</option>`).join('');
  }else{
    sc.innerHTML=`<option>${esc(S.cls)}</option>`;
    $('selG').innerHTML=`<option>${S.group?'Grupa '+esc(S.group):'Wszystkie grupy'}</option>`;
  }
  const st=$('selT');
  const cur=curTT?curTT.num:'';
  st.innerHTML=`<option value="auto" ${S.tt==='auto'?'selected':''}>Automatycznie (aktualny${curTT&&S.tt==='auto'?': '+esc(curTT.name):''})</option>`+
    [...TTS].sort((a,b)=>b.from.localeCompare(a.from)).map(t=>`<option value="${t.num}" ${S.tt===t.num?'selected':''}>${esc(t.name)}${t.from?' · od '+esc(t.from):''}</option>`).join('');
}
function openMenu(){$('dcls').textContent='Klasa '+S.cls+(S.group?' · grupa '+S.group:'');$('drawer').classList.add('on');$('scrim').classList.add('on')}
function closeMenu(){$('drawer').classList.remove('on');$('scrim').classList.remove('on')}
document.querySelectorAll('.verv').forEach(e=>e.textContent='v'+APP_VERSION+' · '+APP_DATE);
$('set').onclick=()=>{const d=$('drawer'),sc=$('scrim');d.style.transition=sc.style.transition='none';closeMenu();fillSettings();$('sheet').classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transition=sc.style.transition=''}))};
$('cl').onclick=()=>$('sheet').classList.remove('on');
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')};
$('thm').innerHTML=THEMES.map(t=>`<button data-v="${t.k}" style="--a:${t.a};--b:${t.b}"><span>${t.n}</span></button>`).join('');
$('thm').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.theme=b.dataset.v;saveS();applyTheme();fillSettings();setThemes(false)};
function setThemes(on){$('thl').classList.toggle('on',on);$('thb').setAttribute('aria-expanded',on?'true':'false')}
$('thb').onclick=()=>setThemes(!$('thl').classList.contains('on'));
new MutationObserver(()=>{const o=$('sheet').classList.contains('on');document.body.classList.toggle('sheetopen',o);if(!o)setThemes(false);snowSet(!o&&S.fx&&!RM&&S.theme==='snow')}).observe($('sheet'),{attributes:true,attributeFilter:['class']});
$('fx').onclick=()=>{S.fx=!S.fx;saveS();applyTheme();fillSettings()};
$('selC').onchange=e=>{S.cls=e.target.value;saveS();const c=getClass();if(c){const n=groupNums(c);if(S.group&&n.length&&!n.includes(S.group)){S.group=''}}saveS();fillSettings();render()};
$('selG').onchange=e=>{S.group=e.target.value;saveS();render()};
$('selT').onchange=e=>{S.tt=e.target.value;saveS();$('sheet').classList.remove('on');newPlan=null;loadAll()};

$('px').value=S.proxy||'';
$('px').onchange=e=>{
  const value=e.target.value.trim();
  if(value){
    try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))throw new Error('protocol')}
    catch(_){$('px').setCustomValidity('Podaj poprawny adres proxy zaczynający się od https:// lub http://');$('px').reportValidity();return}
  }
  $('px').setCustomValidity('');
  S.proxy=value;saveS();$('sheet').classList.remove('on');loadAll();
};
document.querySelectorAll('.di[data-v]').forEach(b=>b.onclick=()=>{closeMenu();setView(b.dataset.v)});
$('ref2').onclick=()=>{closeMenu();loadAll()};
$('lite').onclick=()=>{S.fx=!S.fx;saveS();applyTheme();fillSettings()};
$('menu').onclick=openMenu;
$('scrim').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('sheet').classList.remove('on')}});
(function(){let x0=null,y0=0;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);
    if(dy<50){if(x0<24&&dx>70)openMenu();else if($('drawer').classList.contains('on')&&dx<-70)closeMenu()}x0=null},{passive:true});
})();
$('ref').onclick=()=>loadAll();
$('pw').onclick=()=>{weekStart=addDays(weekStart,-7);render()};
$('nw').onclick=()=>{weekStart=addDays(weekStart,7);render()};

/* ---------- start ---------- */
applyTheme();
(function(){const w=(new Date().getDay()+6)%7;if(w>4){weekStart=addDays(mondayOf(new Date()),7);sel=0}else sel=w})();
const cached=LS.get('plan_raw',null);
if(cached&&cached.cards){RAW=prep(cached);$('sub').textContent='dane z pamięci';TTS=[];fillSettings()}
render();loadAll();
</script>
